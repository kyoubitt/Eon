xt-anchor="start">your files</text><text x="76" y="340" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">git branch, or backups</text><path d="M449.3 326.1 L379.6 326.2 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><circle cx="415.0" cy="304" r="15" fill="#2b46c9"/><text x="415.0" y="310" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">5</text><path d="M59.5 409.8 L381.7 409.9 L380.3 503.3 L58.9 500.8 L61.6 411.4" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M59.1 408.9 L380.9 411.6 L378.9 503.6 L61.4 502.4 L58.7 406.9" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="442" font-size="21" fill="#1c1b19" font-weight="700" text-anchor="start">hooks (yours)</text><text x="76" y="470" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">formatter etc. around edits</text><path d="M449.3 456.7 L379.6 456.3 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#h)"/><path d="M59.1 561.2 L380.3 559.3 L378.8 678.8 L58.4 677.0 L59.4 562.9" fill="none" stroke="#c2412d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7"/><path d="M60.4 559.2 L381.5 558.9 L378.3 677.2 L59.8 676.4 L58.8 558.6" fill="none" stroke="#c2412d" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7"/><text x="76" y="592" font-size="21" fill="#c2412d" font-weight="700" text-anchor="start">images</text><text x="76" y="620" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">not built yet; a helper model</text><text x="76" y="642" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">would describe them as text</text><path d="M380.1 618.4 L419.8 619.6 L420.8 470.3 L450.3 470.1 " fill="none" stroke="#c2412d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#h)"/><path d="M858.7 278.3 L1138.3 281.5 L1140.7 373.7 L858.3 372.5 L858.6 279.5" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M859.3 281.8 L1138.5 280.2 L1140.9 373.4 L860.9 372.7 L860.8 283.9" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="876" y="312" font-size="21" fill="#1c1b19" font-weight="700" text-anchor="start">chat tab 1</text><text x="876" y="340" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">a real browser window</text><path d="M789.8 316.3 L860.6 316.6 " fill="none" stroke="#2b46c9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><circle cx="825.0" cy="296" r="15" fill="#2b46c9"/><text x="825.0" y="302" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">2</text><path d="M859.9 352.5 L790.6 352.1 " fill="none" stroke="#2b46c9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><circle cx="825.0" cy="384" r="15" fill="#2b46c9"/><text x="825.0" y="390" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">3</text><path d="M860.4 439.6 L1140.3 440.3 L1138.7 552.4 L861.6 553.2 Z" fill="#e9f3e6"/><path d="M860.8 439.6 L1140.8 440.3 L1139.8 553.2 L858.5 552.9 L858.5 440.1" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M859.9 439.0 L1140.7 440.0 L1140.4 553.5 L859.1 550.2 L858.9 439.9" fill="none" stroke="#2f6b3a" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="876" y="472" font-size="21" fill="#2f6b3a" font-weight="700" text-anchor="start">free web chat</text><text x="876" y="500" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">deepseek, gemini, qwen,</text><text x="876" y="522" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">sees text, never files</text><path d="M999.5 371.5 L1000.6 440.3 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)" marker-start="url(#hs)"/><path d="M449.8 546.4 L609.4 545.6 L608.9 644.8 L451.1 646.5 L451.7 545.8" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M450.3 544.3 L608.7 545.0 L611.2 646.3 L450.8 646.6 L449.2 542.7" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="466" y="577" font-size="21" fill="#1c1b19" font-weight="700" text-anchor="start">commands</text><text x="466" y="605" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">safe: free</text><text x="466" y="627" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">rest: ask you</text><path d="M629.8 544.2 L789.0 544.7 L790.5 645.0 L629.3 646.2 L632.2 544.0" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M628.5 543.3 L791.3 543.3 L790.8 645.3 L629.3 646.0 L626.1 541.5" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="646" y="577" font-size="21" fill="#1c1b19" font-weight="700" text-anchor="start">MCP</text><text x="646" y="605" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">your tools</text><text x="646" y="627" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">you approve</text><path d="M529.9 479.2 L530.5 544.6 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><path d="M709.4 479.3 L710.2 544.9 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><circle cx="558" cy="515" r="15" fill="#2b46c9"/><text x="558" y="521" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">4</text><path d="M450.4 730.5 L791.0 731.5 L790.6 869.0 L449.9 869.0 Z" fill="#e7f5f1"/><path d="M448.2 729.9 L790.8 728.8 L789.2 869.4 L450.7 870.1 L448.8 731.2" fill="none" stroke="#1f7a68" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M449.6 731.1 L791.5 728.5 L791.6 870.8 L448.7 869.8 L450.2 733.1" fill="none" stroke="#1f7a68" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="466" y="762" font-size="21" fill="#1f7a68" font-weight="700" text-anchor="start">sub-agent</text><text x="466" y="790" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">second loop, read only</text><text x="466" y="812" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">max 8 turns, 3 per request</text><text x="466" y="834" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">returns up to 300 words</text><path d="M789.8 440.1 L825.6 440.5 L825.7 774.9 L790.2 774.5 " fill="none" stroke="#1f7a68" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#h)"/><text x="836" y="640" font-size="14" fill="#1f7a68" font-weight="400" text-anchor="start">delegate</text><path d="M860.8 731.1 L1140.5 730.8 L1139.0 823.4 L861.7 823.7 L861.0 732.6" fill="none" stroke="#1f7a68" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M859.4 731.5 L1141.3 729.5 L1138.5 821.8 L860.2 823.0 L859.3 729.1" fill="none" stroke="#1f7a68" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="876" y="762" font-size="21" fill="#1f7a68" font-weight="700" text-anchor="start">chat tab 2</text><text x="876" y="790" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">its own tab</text><path d="M790.5 834.3 L860.5 799.5 " fill="none" stroke="#1f7a68" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><path d="M859.5 880.9 L1138.8 878.9 L1140.1 972.7 L861.1 972.6 Z" fill="#e9f3e6"/><path d="M861.6 880.0 L1141.6 878.5 L1139.0 972.1 L859.2 972.8 L862.3 880.1" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M861.2 880.2 L1139.3 879.6 L1141.2 973.4 L858.9 973.3 L863.6 880.3" fill="none" stroke="#2f6b3a" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="876" y="912" font-size="21" fill="#2f6b3a" font-weight="700" text-anchor="start">second model</text><text x="876" y="940" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">can be a different one</text><path d="M1000.1 821.5 L1000.1 880.0 " fill="none" stroke="#1f7a68" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)" marker-start="url(#hs)"/><text x="60" y="760" font-size="20" fill="#1c1b19" font-weight="800" text-anchor="start">one round</text><circle cx="74" cy="800" r="15" fill="#2b46c9"/><text x="74" y="806" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="100" y="806" font-size="16" fill="#1c1b19" font-weight="400" text-anchor="start">you ask</text><circle cx="74" cy="840" r="15" fill="#2b46c9"/><text x="74" y="846" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="100" y="846" font-size="16" fill="#1c1b19" font-weight="400" text-anchor="start">prompt out to the chat</text><circle cx="74" cy="880" r="15" fill="#2b46c9"/><text x="74" y="886" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="100" y="886" font-size="16" fill="#1c1b19" font-weight="400" text-anchor="start">reply back as text</text><circle cx="74" cy="920" r="15" fill="#2b46c9"/><text x="74" y="926" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="100" y="926" font-size="16" fill="#1c1b19" font-weight="400" text-anchor="start">runtime checks, you approve</text><circle cx="74" cy="960" r="15" fill="#2b46c9"/><text x="74" y="966" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="100" y="966" font-size="16" fill="#1c1b19" font-weight="400" text-anchor="start">it runs, results go back to 2</text><text x="60" y="1060" font-size="15" fill="#2b46c9" font-weight="400" text-anchor="start">solid = works, tested on stand-in sites.   dashed = planned or optional.</text><text x="60" y="1086" font-size="15" fill="#2b46c9" font-weight="400" text-anchor="start">the live deepseek page itself is untested from the build machine.</text><text x="1140" y="1086" font-size="15" fill="#77736a" font-weight="400" text-anchor="end">esc / ctrl+c stop anything</text></svg>