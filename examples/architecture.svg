<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" font-family="JetBrains Mono, DejaVu Sans Mono, monospace"><defs><marker id="h" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#333" stroke-width="1.8"/></marker><marker id="hs" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#333" stroke-width="1.8"/></marker></defs><rect width="1200" height="1130" fill="#fbfaf5"/><rect x="38" y="42" width="527" height="40" fill="#ffe66d" opacity=".6" transform="rotate(-.8 38 42)"/><text x="50" y="72" font-size="26" fill="#1c1b19" font-weight="800" text-anchor="start">eon: what happens to one request</text><path d="M59.8 120.2 L381.5 119.9 L380.0 212.3 L58.9 212.0 L60.5 121.7" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M58.5 119.3 L378.5 121.1 L380.7 210.4 L61.7 213.7 L59.3 119.9" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="152" font-size="21" fill="#1c1b19" font-weight="700" text-anchor="start">you</text><text x="76" y="180" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">type a task, approve plans</text><path d="M448.8 118.3 L790.1 118.4 L788.9 211.1 L448.3 211.9 L448.5 120.0" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M450.1 120.5 L790.0 120.6 L789.8 211.2 L451.8 213.8 L451.8 121.5" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="466" y="152" font-size="21" fill="#1c1b19" font-weight="700" text-anchor="start">terminal</text><text x="466" y="180" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">status line, diffs, Esc stops</text><path d="M379.7 165.6 L449.7 165.3 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><circle cx="415" cy="148" r="15" fill="#2b46c9"/><text x="415" y="154" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">1</text><path d="M450.9 279.7 L791.1 279.6 L791.5 481.1 L448.4 479.1 Z" fill="#eef1ff"/><path d="M451.5 279.9 L791.7 279.6 L788.5 480.5 L451.0 479.2 L449.4 279.1" fill="none" stroke="#2b46c9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M451.7 280.9 L788.6 279.1 L788.6 478.4 L451.1 478.8 L452.0 280.7" fill="none" stroke="#2b46c9" stroke-width="1.6500000000000001" stroke-linejoin="round" stroke-linecap="round"/><text x="466" y="312" font-size="21" fill="#2b46c9" font-weight="700" text-anchor="start">runtime</text><text x="466" y="340" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">reads the reply as ACTIONS</text><text x="466" y="362" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">plan gate: no edit without</text><text x="466" y="384" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">an approved plan</text><text x="466" y="406" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">keeps evidence, saves session</text><path d="M619.5 212.4 L619.4 280.2 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><circle cx="648.0" cy="250" r="15" fill="#2b46c9"/><text x="648.0" y="256" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">2</text><path d="M58.6 279.7 L379.0 279.2 L381.7 373.1 L59.3 373.4 L57.2 279.2" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M61.3 280.5 L378.6 281.8 L379.0 371.1 L61.0 371.4 L60.3 278.4" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="312" font-size="21" fill="#1c1b19" font-weight="700" text-anchor="start">your files</text><text x="76" y="340" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">git branch, or backups</text><path d="M449.3 326.1 L379.6 326.2 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><circle cx="415.0" cy="304" r="15" fill="#2b46c9"/><text x="415.0" y="310" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">5</text><path d="M59.5 409.8 L381.7 409.9 L380.3 503.3 L58.9 500.8 L61.6 411.4" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M59.1 408.9 L380.9 411.6 L378.9 503.6 L61.4 502.4 L58.7 406.9" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="442" font-size="21" fill="#1c1b19" font-weight="700" text-anchor="start">hooks (yours)</text><text x="76" y="470" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">formatter etc. around edits</text><path d="M449.3 456.7 L379.6 456.3 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#h)"/><path d="M59.2 561.0 L380.3 559.3 L379.0 678.7 L58.6 677.1 Z" fill="#fff6e9"/><path d="M60.2 561.3 L380.4 559.2 L381.5 676.9 L58.3 677.2 L59.9 559.1" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M58.8 559.5 L380.3 558.7 L379.5 679.4 L61.7 678.6 L59.8 559.9" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="592" font-size="21" fill="#1c1b19" font-weight="700" text-anchor="start">pictures</text><text x="76" y="620" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">@shot.png or /image path</text><text x="76" y="642" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">text-only models get a</text><text x="76" y="664" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">description from a helper</text><path d="M379.4 618.3 L419.2 619.7 L420.3 470.7 L449.2 470.2 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><text x="60" y="704" font-size="14" fill="#2b46c9" font-weight="400" text-anchor="start">look, screenshot, inspect_page</text><path d="M859.9 280.8 L1139.3 281.8 L1138.5 372.2 L860.9 373.4 L861.1 281.8" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M861.1 281.5 L1139.5 280.7 L1141.4 373.3 L859.7 373.0 L862.9 281.9" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="876" y="312" font-size="21" fill="#1c1b19" font-weight="700" text-anchor="start">chat tab 1</text><text x="876" y="340" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">a real browser window</text><path d="M790.2 315.8 L860.1 316.2 " fill="none" stroke="#2b46c9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><circle cx="825.0" cy="296" r="15" fill="#2b46c9"/><text x="825.0" y="302" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">2</text><path d="M859.3 352.2 L790.8 352.6 " fill="none" stroke="#2b46c9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><circle cx="825.0" cy="384" r="15" fill="#2b46c9"/><text x="825.0" y="390" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">3</text><path d="M860.7 439.6 L1140.8 440.3 L1139.8 553.1 L858.7 552.8 Z" fill="#e9f3e6"/><path d="M858.3 440.4 L1139.9 439.0 L1140.7 552.0 L860.4 553.5 L857.1 437.9" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M859.3 440.6 L1138.9 438.8 L1141.5 552.6 L859.8 553.4 L858.4 441.5" fill="none" stroke="#2f6b3a" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="876" y="472" font-size="21" fill="#2f6b3a" font-weight="700" text-anchor="start">free web chat</text><text x="876" y="500" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">deepseek, gemini, qwen,</text><text x="876" y="522" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">sees text, never files</text><path d="M999.5 371.9 L1000.5 440.7 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)" marker-start="url(#hs)"/><path d="M451.4 544.6 L610.3 544.3 L608.7 645.0 L451.2 646.3 L452.4 546.8" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M449.2 543.8 L609.8 544.2 L609.0 644.7 L450.5 645.0 L448.3 545.5" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="466" y="577" font-size="21" fill="#1c1b19" font-weight="700" text-anchor="start">commands</text><text x="466" y="605" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">safe: free</text><text x="466" y="627" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">rest: ask you</text><path d="M631.7 544.8 L788.5 543.3 L791.3 643.3 L630.8 645.3 L630.8 546.3" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M628.3 543.7 L789.8 543.3 L791.2 644.1 L628.7 643.4 L628.9 543.4" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="646" y="577" font-size="21" fill="#1c1b19" font-weight="700" text-anchor="start">MCP</text><text x="646" y="605" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">your tools</text><text x="646" y="627" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">you approve</text><path d="M530.2 480.2 L530.5 545.7 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><path d="M710.3 479.5 L710.0 544.5 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><circle cx="558" cy="515" r="15" fill="#2b46c9"/><text x="558" y="521" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">4</text><path d="M448.4 729.9 L790.7 729.0 L789.3 869.5 L450.6 870.1 Z" fill="#e7f5f1"/><path d="M450.4 730.9 L789.6 731.1 L791.5 868.5 L451.6 870.8 L448.6 730.7" fill="none" stroke="#1f7a68" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M450.5 731.5 L789.6 730.2 L791.4 871.1 L451.6 869.9 L451.2 730.0" fill="none" stroke="#1f7a68" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="466" y="762" font-size="21" fill="#1f7a68" font-weight="700" text-anchor="start">sub-agent</text><text x="466" y="790" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">second loop, read only</text><text x="466" y="812" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">max 8 turns, 3 per request</text><text x="466" y="834" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">returns up to 300 words</text><path d="M790.4 440.5 L825.2 440.3 L824.5 775.6 L790.8 775.8 " fill="none" stroke="#1f7a68" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#h)"/><text x="836" y="640" font-size="14" fill="#1f7a68" font-weight="400" text-anchor="start">delegate</text><path d="M860.1 731.0 L1139.4 731.5 L1141.3 821.5 L858.5 821.8 L860.4 732.4" fill="none" stroke="#1f7a68" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M860.0 728.3 L1141.1 728.4 L1141.1 820.8 L859.4 823.0 L858.2 726.5" fill="none" stroke="#1f7a68" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="876" y="762" font-size="21" fill="#1f7a68" font-weight="700" text-anchor="start">chat tab 2</text><text x="876" y="790" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">its own tab</text><path d="M790.0 835.4 L860.5 800.3 " fill="none" stroke="#1f7a68" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><path d="M861.4 880.0 L1141.4 878.7 L1139.1 972.1 L859.3 972.7 Z" fill="#e9f3e6"/><path d="M860.5 880.1 L1141.2 880.2 L1139.3 971.6 L861.2 973.4 L859.0 881.8" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M861.7 880.1 L1140.3 878.9 L1140.1 972.0 L860.4 970.3 L864.0 880.2" fill="none" stroke="#2f6b3a" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="876" y="912" font-size="21" fill="#2f6b3a" font-weight="700" text-anchor="start">second model</text><text x="876" y="940" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">can be a different one</text><path d="M999.8 822.5 L1000.1 880.0 " fill="none" stroke="#1f7a68" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)" marker-start="url(#hs)"/><text x="60" y="760" font-size="20" fill="#1c1b19" font-weight="800" text-anchor="start">one round</text><circle cx="74" cy="800" r="15" fill="#2b46c9"/><text x="74" y="806" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="100" y="806" font-size="16" fill="#1c1b19" font-weight="400" text-anchor="start">you ask</text><circle cx="74" cy="840" r="15" fill="#2b46c9"/><text x="74" y="846" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="100" y="846" font-size="16" fill="#1c1b19" font-weight="400" text-anchor="start">prompt out to the chat</text><circle cx="74" cy="880" r="15" fill="#2b46c9"/><text x="74" y="886" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="100" y="886" font-size="16" fill="#1c1b19" font-weight="400" text-anchor="start">reply back as text</text><circle cx="74" cy="920" r="15" fill="#2b46c9"/><text x="74" y="926" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="100" y="926" font-size="16" fill="#1c1b19" font-weight="400" text-anchor="start">runtime checks, you approve</text><circle cx="74" cy="960" r="15" fill="#2b46c9"/><text x="74" y="966" font-size="17" fill="#fff" font-weight="700" text-anchor="middle">5</text><text x="100" y="966" font-size="16" fill="#1c1b19" font-weight="400" text-anchor="start">it runs, results go back to 2</text><text x="60" y="1060" font-size="15" fill="#2b46c9" font-weight="400" text-anchor="start">solid = works, tested on stand-in sites.   dashed = optional, only if you set it up.</text><text x="60" y="1086" font-size="15" fill="#2b46c9" font-weight="400" text-anchor="start">the live deepseek page itself is untested from the build machine.</text><text x="1140" y="1086" font-size="15" fill="#77736a" font-weight="400" text-anchor="end">esc / ctrl+c stop anything</text></svg>