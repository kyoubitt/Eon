<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" font-family="JetBrains Mono, DejaVu Sans Mono, monospace"><defs><marker id="h" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#333" stroke-width="1.8"/></marker><marker id="hs" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#333" stroke-width="1.8"/></marker></defs><rect width="1200" height="1130" fill="#fbfaf5"/><rect x="38" y="42" width="527" height="40" fill="#ffe66d" opacity=".6" transform="rotate(-.8 38 42)"/><text x="50" y="72" font-size="26" fill="#1c1b19" font-weight="800" text-anchor="start">eon: what happens to one request</text><path d="M59.8 120.2 L381.5 119.9 L380.0 212.3 L58.9 212.0 L60.5 121.7" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M58.5 119.3 L378.5 121.1 L380.7 210.4 L61.7 213.7 L59.3 119.9" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="152" font-size="21" fill="#1c1b19" font-weight="700" text-anchor="start">you</text><text x="76" y="180" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">type a task, approve plans</text><path d="M448.8 118.3 L790.1 118.4 L788.9 211.1 L448.3 211.9 L448.5 120.0" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M450.1 120.5 L790.0 120.6 L789.8 211.2 L451.8 213.8 L451.8 121.5" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="466" y="152" font-size="21" fill="#1c1b19" font-weight="700" text-anchor="start">terminal</text><text x="466" y="180" font-size="15.5" fill="#77736a" font-weight="400" text-anchor="start">status line, diffs, Esc stops</text><path d="M379.7 165.6 L449.7 165.3 " fill="none" stroke=