name: release
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0. It builds the zip, publishes a
# GitHub release named after the version in package.json (the tag is created for you), and publishes the
# package to GitHub Packages as @<owner>/eon.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the zip (files at the top level, so Windows "Extract All" does not nest a folder)
        run: git archive --format=zip -o eon.zip HEAD
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          gh release create "$VERSION" eon.zip --target "$GITHUB_SHA" --title "Eon $VERSION" --generate-notes
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'
      - name: Name the package for GitHub Packages
        run: npm pkg set name="@${GITHUB_REPOSITORY_OWNER,,}/eon"
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
