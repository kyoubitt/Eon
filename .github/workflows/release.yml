name: release
# Runs on every push to main (and by hand from the Actions tab). It does nothing if this version is already
# published. To make a new release, raise "version" in package.json and push.
#   - a GitHub release named after the version, with eon.zip attached (the tag is created for you)
#   - the package on GitHub Packages as @<owner>/eon
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if this version has none yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" >/dev/null 2>&1; then echo "$VERSION is already released"; exit 0; fi
          git archive --format=zip -o eon.zip HEAD
          gh release create "$VERSION" eon.zip --target "$GITHUB_SHA" --title "Eon $VERSION" --generate-notes
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'
      - name: Publish this version to GitHub Packages if it is not there yet
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME="@${GITHUB_REPOSITORY_OWNER,,}/eon"
          npm pkg set name="$NAME"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then echo "$NAME@$VERSION is already published"; exit 0; fi
          npm publish
