<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="JetBrains Mono, DejaVu Sans Mono, monospace"><defs><marker id="h" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#333" stroke-width="1.8"/></marker><marker id="hs" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#333" stroke-width="1.8"/></marker></defs><rect width="1200" height="760" fill="#fbfaf5"/><rect x="38" y="42" width="918" height="40" fill="#ffe66d" opacity=".6" transform="rotate(-.8 50 72)"/><text x="50" y="72" font-size="26" fill="#1c1b19" font-weight="800" text-anchor="start">the plan gate: nothing is edited until you approve a plan</text><path d="M60.4 120.9 L311.1 121.6 L310.9 221.5 L58.3 219.9 L62.7 121.6" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M61.4 118.6 L309.9 119.1 L310.2 220.3 L58.2 219.0 L60.3 120.7" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="152" font-size="20" fill="#1c1b19" font-weight="700" text-anchor="start">1 investigate</text><text x="76" y="178" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">read files, search,</text><text x="76" y="200" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">run read-only commands</text><path d="M380.9 118.9 L631.0 118.8 L630.4 218.8 L378.4 221.2 Z" fill="#eef1ff"/><path d="M379.0 119.0 L631.7 121.3 L629.2 221.7 L380.1 220.6 L377.5 121.2" fill="none" stroke="#2b46c9" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M380.7 121.7 L631.4 119.3 L629.5 218.8 L378.7 218.4 L379.7 122.2" fill="none" stroke="#2b46c9" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="396" y="152" font-size="20" fill="#2b46c9" font-weight="700" text-anchor="start">2 plan</text><text x="396" y="178" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">claims + evidence,</text><text x="396" y="200" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">steps, validation</text><path d="M698.4 120.6 L949.5 119.4 L951.0 219.9 L699.4 219.9 Z" fill="#fff6e0"/><path d="M700.7 118.4 L951.7 118.3 L950.9 221.2 L698.3 221.0 L700.1 118.8" fill="none" stroke="#b7791f" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M698.2 118.4 L948.9 121.6 L948.9 220.9 L701.5 221.6 L697.5 117.6" fill="none" stroke="#b7791f" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="716" y="152" font-size="20" fill="#b7791f" font-weight="700" text-anchor="start">3 you approve</text><text x="716" y="178" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">or type what to</text><text x="716" y="200" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">change; it re-plans</text><path d="M310.0 170.4 L379.4 170.4 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><path d="M630.5 170.6 L699.3 170.7 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><path d="M698.5 299.4 L950.4 301.5 L949.4 401.5 L700.2 399.3 L697.6 297.8" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M698.5 298.7 L950.7 301.8 L948.8 398.4 L701.8 400.1 L698.0 297.4" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="716" y="332" font-size="20" fill="#1c1b19" font-weight="700" text-anchor="start">4 one step</text><text x="716" y="358" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">you say yes to</text><text x="716" y="380" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">start it (guided)</text><path d="M825.2 220.5 L824.9 299.9 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><path d="M378.4 301.5 L628.3 300.0 L631.2 398.7 L380.8 401.6 L379.1 302.9" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M378.6 299.8 L628.7 301.2 L629.3 399.8 L381.8 401.3 L381.0 299.5" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="396" y="332" font-size="20" fill="#1c1b19" font-weight="700" text-anchor="start">5 edit + run</text><text x="396" y="358" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">numbered diff shown,</text><text x="396" y="380" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">commands ask first</text><path d="M700.0 350.4 L630.0 349.7 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><path d="M59.7 298.9 L309.6 301.6 L311.5 400.4 L60.0 399.5 Z" fill="#e9f3e6"/><path d="M58.5 299.2 L311.0 301.3 L309.5 401.0 L61.0 400.7 L59.3 300.5" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M59.5 300.7 L309.2 299.9 L311.0 400.7 L59.3 401.6 L60.3 301.1" fill="none" stroke="#2f6b3a" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="332" font-size="20" fill="#2f6b3a" font-weight="700" text-anchor="start">6 verify</text><text x="76" y="358" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">a claim becomes</text><text x="76" y="380" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">verified or disproved</text><path d="M379.2 350.1 L309.6 350.3 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><path d="M59.9 481.1 L310.5 481.1 L309.5 590.5 L60.9 591.2 L59.1 482.9" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M61.3 480.7 L311.7 481.6 L310.1 590.1 L58.8 591.2 L63.5 480.6" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="512" font-size="20" fill="#1c1b19" font-weight="700" text-anchor="start">7 step done</text><text x="76" y="538" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">committed on its own</text><text x="76" y="560" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">branch (or backed up)</text><path d="M185.3 400.4 L185.4 479.5 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><path d="M380.9 480.3 L630.5 479.7 L630.4 590.9 L380.4 590.7 Z" fill="#e9f3e6"/><path d="M378.3 478.8 L629.8 480.5 L629.0 590.7 L380.5 588.4 L378.2 477.4" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M378.4 478.7 L629.3 478.9 L628.9 588.3 L379.9 589.6 L379.0 479.1" fill="none" stroke="#2f6b3a" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="396" y="512" font-size="20" fill="#2f6b3a" font-weight="700" text-anchor="start">8 done</text><text x="396" y="538" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">evidence, steps,</text><text x="396" y="560" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">confidence, /diff</text><path d="M309.6 535.6 L379.2 534.8 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><path d="M699.2 479.7 L1098.6 481.2 L1099.5 588.3 L700.4 588.5 L699.4 478.9" fill="none" stroke="#c2412d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7"/><path d="M700.3 481.6 L1101.1 479.7 L1101.1 590.5 L699.5 588.7 L700.8 482.0" fill="none" stroke="#c2412d" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7"/><text x="716" y="512" font-size="20" fill="#c2412d" font-weight="700" text-anchor="start">disproved? the plan is revoked</text><text x="716" y="538" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">edits lock again, the mistake is</text><text x="716" y="560" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">recorded and becomes a lesson</text><path d="M185.7 300.7 L185.2 261.8 L505.6 261.2 L504.4 220.1 " fill="none" stroke="#c2412d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#h)"/><text x="260" y="250" font-size="14" fill="#c2412d" font-weight="400" text-anchor="start">a disproved claim sends it back to plan</text><text x="60" y="660" font-size="15" fill="#2b46c9" font-weight="400" text-anchor="start">Enforced by the program, not by asking the model nicely: an edit action without an approved plan is refused.</text><text x="60" y="686" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">Quick level lets edits under 20 lines in one file skip steps 2-3.</text></svg>