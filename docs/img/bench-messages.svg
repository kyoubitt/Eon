<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="JetBrains Mono, DejaVu Sans Mono, monospace"><defs><marker id="h" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#333" stroke-width="1.8"/></marker><marker id="hs" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#333" stroke-width="1.8"/></marker></defs><rect width="1200" height="520" fill="#fbfaf5"/><rect x="38" y="42" width="949" height="40" fill="#ffe66d" opacity=".6" transform="rotate(-.8 50 72)"/><text x="50" y="72" font-size="26" fill="#1c1b19" font-weight="800" text-anchor="start">model messages needed for a one-line fix (scripted minimum)</text><text x="60" y="165.46666666666667" font-size="16" fill="#1c1b19" font-weight="600" text-anchor="start">focused</text><path d="M211.5 133.5 L876.0 136.3 L876.5 173.8 L210.5 174.5 Z" fill="#2b46c933"/><path d="M211.4 133.7 L879.2 134.0 L877.9 176.6 L210.7 176.5 L212.4 131.4" fill="none" stroke="#2b46c9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M211.4 135.0 L876.8 133.6 L878.8 175.3 L211.6 176.0 L213.7 135.3" fill="none" stroke="#2b46c9" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="889.5" y="165.46666666666667" font-size="16" fill="#1c1b19" font-weight="700" text-anchor="start">3 messages</text><text x="60" y="238.79999999999998" font-size="16" fill="#1c1b19" font-weight="600" text-anchor="start">quick</text><path d="M210.6 208.4 L431.7 209.5 L431.9 249.2 L211.5 248.8 Z" fill="#2f6b3a33"/><path d="M208.7 209.2 L433.1 206.9 L430.9 248.4 L208.3 249.9 L208.7 209.3" fill="none" stroke="#2f6b3a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M209.7 208.6 L434.0 207.3 L432.0 248.6 L209.3 248.7 L209.9 208.2" fill="none" stroke="#2f6b3a" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="444.5" y="238.79999999999998" font-size="16" fill="#1c1b19" font-weight="700" text-anchor="start">1 messages</text><text x="60" y="312.13333333333327" font-size="16" fill="#1c1b19" font-weight="600" text-anchor="start">quick + accept</text><path d="M210.6 281.4 L431.2 282.9 L432.0 321.4 L209.7 323.0 Z" fill="#1f7a6833"/><path d="M211.6 281.4 L432.1 279.9 L433.9 320.5 L210.2 321.1 L210.8 280.7" fill="none" stroke="#1f7a68" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M208.9 279.7 L432.6 282.4 L433.0 320.6 L210.7 320.1 L208.4 281.3" fill="none" stroke="#1f7a68" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><text x="444.5" y="312.13333333333327" font-size="16" fill="#1c1b19" font-weight="700" text-anchor="start">1 messages</text><text x="60" y="380" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">focused: read the code, send a plan, then edit and finish. quick: an edit under 20 lines in one file needs no plan.</text><text x="60" y="404" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">A scripted model that answers in the fewest messages the rules allow; a real model can take more. It shows the protocol, not a model.</text><text x="60" y="440" font-size="15" fill="#2b46c9" font-weight="400" text-anchor="start">start-up: eon --help takes 70 ms (median of 15 runs)</text></svg>