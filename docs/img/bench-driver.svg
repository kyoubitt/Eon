's fixed cost: a human-like pause, the click, a short quiet window to be sure the reply is finished.</text><text x="60" y="624" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">deepseek is 3.3 s because its stand-in page also simulates 1.8 s of "thinking". A real model adds its own time on top.</text><text x="60" y="660" font-size="14" fill="#2b46c9" font-weight="400" text-anchor="start">median of 12 messages per site · node 22.23.4 · linux x64 · 4 cores</text></svg>