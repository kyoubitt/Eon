 is Eon's own cost per message: paste it, send it, and a short quiet window to be sure the reply is finished.</text><text x="60" y="624" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">A real model adds its own time on top. Pauses meant to look human are off by default (--pace slow adds them).</text><text x="60" y="660" font-size="14" fill="#2b46c9" font-weight="400" text-anchor="start">median of 12 messages per site · node 22.23.4 · linux x64 · 4 cores</text></svg>