<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" font-family="JetBrains Mono, DejaVu Sans Mono, monospace"><defs><marker id="h" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#333" stroke-width="1.8"/></marker><marker id="hs" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#333" stroke-width="1.8"/></marker></defs><rect width="1200" height="1020" fill="#fbfaf5"/><rect x="38" y="42" width="903" height="40" fill="#ffe66d" opacity=".6" transform="rotate(-.8 50 72)"/><text x="50" y="72" font-size="26" fill="#1c1b19" font-weight="800" text-anchor="start">where Eon keeps things, and how it tracks a conversation</text><path d="M39.1 111.5 L578.8 110.7 L578.7 409.2 L41.6 409.1 Z" fill="#eef1ff"/><path d="M40.5 109.9 L579.8 110.0 L578.9 411.2 L38.5 409.0 L38.1 108.7" fill="none" stroke="#2b46c9" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M39.7 111.4 L579.6 108.6 L579.1 411.8 L38.4 410.4 L39.1 112.3" fill="none" stroke="#2b46c9" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="56" y="142" font-size="20" fill="#2b46c9" font-weight="700" text-anchor="start">your project folder</text><text x="56" y="168" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">EON.md             project memory (shared)</text><text x="56" y="190" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">EON.local.md       memory only you see</text><text x="56" y="212" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">.eon/tasks/&lt;id&gt;/    one folder per session:</text><text x="56" y="234" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">    session.json  status, mode, step progress</text><text x="56" y="256" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">    plan.json     claims, tags, evidence</text><text x="56" y="278" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">    chat.jsonl    every message sent and reply</text><text x="56" y="300" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">    events.jsonl  what you saw (for /resume)</text><text x="56" y="322" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">    audit.jsonl   every action and its result</text><path d="M39.4 440.7 L580.0 440.5 L581.4 690.3 L38.7 688.4 L41.6 440.6" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M38.9 441.6 L580.3 440.8 L581.4 689.2 L39.5 691.4 L37.1 442.9" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="56" y="472" font-size="20" fill="#1c1b19" font-weight="700" text-anchor="start">.eon/ (more, same folder)</text><text x="56" y="498" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">backups/&lt;id&gt;/   copies before edits (no git)</text><text x="56" y="520" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">worktrees/&lt;id&gt;/ the session branch checkout</text><text x="56" y="542" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">memory.json     notes; mistakes.jsonl lessons</text><text x="56" y="564" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">research.jsonl  fetched docs; skills/ agents/</text><text x="56" y="586" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">exports/ shots/ vision/   reports, pictures</text><text x="56" y="608" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">mcp.json  settings.json   servers, rules, hooks</text><path d="M618.7 110.6 L1160.6 111.4 L1161.1 360.0 L619.0 358.9 Z" fill="#e9f3e6"/><path d="M620.1 110.0 L1158.5 111.5 L1160.0 360.7 L619.0 359.1 L617.7 109.3" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M619.2 109.7 L1159.6 111.2 L1161.4 358.8 L619.6 358.8 L620.0 112.1" fill="none" stroke="#2f6b3a" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="636" y="142" font-size="20" fill="#2f6b3a" font-weight="700" text-anchor="start">~/.eon (your home, all projects)</text><text x="636" y="168" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">config.json     your defaults</text><text x="636" y="190" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">selectors.json  what Eon learned per site</text><text x="636" y="212" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">sites.json      sites you added</text><text x="636" y="234" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">EON.md          memory for every project</text><text x="636" y="256" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">chrome/         the logged-in browser profile</text><text x="636" y="278" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">harness-*.txt   reports you can paste</text><path d="M619.0 390.9 L1159.4 388.4 L1160.8 689.5 L618.9 689.8 Z" fill="#fff6e0"/><path d="M619.0 389.7 L1159.8 389.7 L1160.3 689.2 L618.5 688.5 L617.1 389.8" fill="none" stroke="#b7791f" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M619.5 391.1 L1160.0 390.7 L1161.7 688.4 L618.3 688.7 L618.9 391.5" fill="none" stroke="#b7791f" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="636" y="422" font-size="20" fill="#b7791f" font-weight="700" text-anchor="start">on the chat site (DeepSeek etc.)</text><text x="636" y="448" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">The site keeps its own copy of each chat in</text><text x="636" y="470" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">your account. Eon opens a fresh chat per session.</text><text x="636" y="492" font-size="15" fill="#77736a" font-weight="400" text-anchor="start"></text><text x="636" y="514" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">Continuity is Eon's job, not the site's:</text><text x="636" y="536" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">the local files above are the record. A long</text><text x="636" y="558" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">chat is summarised into a new one; a new model</text><text x="636" y="580" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">gets the same summary. Nothing here is needed</text><text x="636" y="602" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">for Eon to resume after a crash.</text><path d="M580.4 259.8 L620.7 259.2 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)" marker-start="url(#hs)"/><text x="40" y="730" font-size="15" fill="#2b46c9" font-weight="400" text-anchor="start">Besides your messages to the chat site, Eon only fetches pages you approve (docs, screenshots) and, once a day,</text><text x="40" y="752" font-size="15" fill="#2b46c9" font-weight="400" text-anchor="start">asks GitHub for a newer version (a plain request; /config update-check off).</text><path d="M41.2 789.0 L1161.4 788.3 L1161.7 980.9 L41.8 980.3 L39.6 791.3" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M39.8 788.5 L1160.4 790.0 L1159.9 978.8 L38.6 980.3 L39.6 786.6" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="56" y="822" font-size="20" fill="#1c1b19" font-weight="700" text-anchor="start">how it keeps track</text><text x="56" y="848" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">1  Each request gets an id. Every message, action and result is appended to that session's files as it happens.</text><text x="56" y="870" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">2  session.json is rewritten atomically after each step; a lock file is touched every 5 s while Eon is busy.</text><text x="56" y="892" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">3  /resume replays events.jsonl and restores plan, steps and usage; the model gets a fresh chat plus a digest.</text><text x="56" y="914" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">4  A session whose lock went stale was cut off: Eon offers to resume it and warns the model to re-check files.</text></svg>