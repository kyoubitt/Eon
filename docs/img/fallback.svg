<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="JetBrains Mono, DejaVu Sans Mono, monospace"><defs><marker id="h" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#333" stroke-width="1.8"/></marker><marker id="hs" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#333" stroke-width="1.8"/></marker></defs><rect width="1200" height="800" fill="#fbfaf5"/><rect x="38" y="42" width="809" height="40" fill="#ffe66d" opacity=".6" transform="rotate(-.8 50 72)"/><text x="50" y="72" font-size="26" fill="#1c1b19" font-weight="800" text-anchor="start">when a site pushes back: limits, checks and logins</text><path d="M59.8 120.2 L361.5 119.9 L360.0 230.3 L58.9 230.0 L60.5 121.7" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M58.5 119.3 L358.5 121.1 L360.7 228.4 L61.7 231.7 L59.3 119.9" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="152" font-size="20" fill="#1c1b19" font-weight="700" text-anchor="start">a reply arrives</text><text x="76" y="178" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">Eon reads it as text and</text><text x="76" y="200" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">looks at what it says</text><path d="M458.9 118.4 L760.1 118.6 L759.0 229.2 L458.5 229.9 Z" fill="#fff6e0"/><path d="M459.8 121.2 L760.1 120.5 L760.0 230.6 L459.8 229.2 L462.3 123.7" fill="none" stroke="#b7791f" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M461.2 120.7 L759.3 119.0 L759.2 228.5 L461.0 229.6 L463.0 120.2" fill="none" stroke="#b7791f" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="476" y="152" font-size="20" fill="#b7791f" font-weight="700" text-anchor="start">usage limit notice?</text><text x="476" y="178" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">"limit reached", "try again</text><text x="476" y="200" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">later" and the like</text><path d="M360.7 175.6 L459.2 174.5 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><path d="M861.3 119.9 L1161.5 119.7 L1158.6 230.4 L860.9 229.3 Z" fill="#e9f3e6"/><path d="M858.5 119.4 L1161.7 120.9 L1158.6 229.1 L858.6 228.4 L860.0 117.8" fill="none" stroke="#2f6b3a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M860.2 119.8 L1158.9 120.8 L1158.7 230.5 L858.6 229.7 L858.8 118.7" fill="none" stroke="#2f6b3a" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="876" y="152" font-size="20" fill="#2f6b3a" font-weight="700" text-anchor="start">next model takes over</text><text x="876" y="178" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">same task, a short summary,</text><text x="876" y="200" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">a fresh chat (--model a,b,c)</text><path d="M760.8 175.5 L859.7 175.6 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><text x="780" y="160" font-size="14" fill="#2f6b3a" font-weight="400" text-anchor="start">yes</text><path d="M459.1 299.7 L761.1 300.5 L758.7 411.6 L459.1 409.2 Z" fill="#fff6e0"/><path d="M461.0 299.4 L759.3 298.5 L758.5 410.3 L459.1 410.4 L460.3 299.2" fill="none" stroke="#b7791f" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M461.7 299.9 L760.3 301.3 L758.9 408.8 L461.5 411.1 L460.4 298.4" fill="none" stroke="#b7791f" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="476" y="332" font-size="20" fill="#b7791f" font-weight="700" text-anchor="start">none left?</text><text x="476" y="358" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">ask: wait 10 min,</text><text x="476" y="380" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">retry now, or stop</text><path d="M610.4 230.7 L609.5 300.7 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><path d="M61.2 480.3 L399.7 478.7 L398.5 611.5 L59.2 610.7 Z" fill="#fff1ee"/><path d="M59.1 481.2 L400.3 479.3 L398.8 610.8 L58.4 609.0 L59.4 482.9" fill="none" stroke="#c2412d" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M60.4 479.2 L401.5 478.9 L398.3 609.2 L59.8 608.4 L58.8 478.6" fill="none" stroke="#c2412d" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="512" font-size="20" fill="#c2412d" font-weight="700" text-anchor="start">human check or login page</text><text x="76" y="538" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">Eon never solves it. It brings</text><text x="76" y="560" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">the window forward and tells you,</text><text x="76" y="582" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">then carries on once it is gone</text><path d="M460.3 478.7 L759.5 481.4 L761.7 610.6 L460.7 610.3 L458.5 476.3" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M458.3 481.5 L760.7 481.7 L758.3 610.5 L459.9 610.8 L457.4 484.0" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="476" y="512" font-size="20" fill="#1c1b19" font-weight="700" text-anchor="start">you skip it</text><text x="476" y="538" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">with one model Eon stops</text><text x="476" y="560" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">right away. It is not a</text><text x="476" y="582" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">limit, so no 10 minute wait</text><path d="M399.3 545.1 L460.4 545.6 " fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h)"/><path d="M860.9 480.7 L1161.1 481.5 L1159.5 610.7 L861.4 611.3 L860.4 482.2" fill="none" stroke="#1c1b19" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M861.3 480.3 L1160.4 479.6 L1160.3 610.4 L858.5 610.5 L863.8 482.2" fill="none" stroke="#1c1b19" stroke-width="1.2100000000000002" stroke-linejoin="round" stroke-linecap="round"/><text x="876" y="512" font-size="20" fill="#1c1b19" font-weight="700" text-anchor="start">message not taken</text><text x="876" y="538" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">tries Enter, the Send button,</text><text x="876" y="560" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">Ctrl+Enter, then asks you:</text><text x="876" y="582" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">wait, try again, or skip</text><text x="60" y="700" font-size="15" fill="#2b46c9" font-weight="400" text-anchor="start">Eon sends one message at a time and never opens parallel tabs on one account.</text><text x="60" y="726" font-size="15" fill="#77736a" font-weight="400" text-anchor="start">Eon does not try to hide that it is automated or get around a limit; it hands the decision back to you.</text></svg>